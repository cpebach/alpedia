[package]
name = "alpedia_view"
version = "0.1.0"
edition = "2021"
description = "Alpedia の画面（Rust・wgpu）。Python から alpedia_view として使う。"

[lib]
name = "alpedia_view"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
numpy = "0.22"
wgpu = "24"
winit = "0.30"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
fontdue = "0.9"
rodio = "0.20"

[features]
abi3 = ["pyo3/abi3-py310"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
