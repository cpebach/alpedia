[package]
name = "alpedia_core"
version = "0.1.0"
edition = "2021"
description = "Alpedia の物理コア（Rust）。Python から alpedia_core として使う。"

[lib]
name = "alpedia_core"
crate-type = ["cdylib"]

[dependencies]
# 1 つのクラスのメソッドを、いくつかのファイルに分けて書けるように（C-02）
pyo3 = { version = "0.22", features = ["multiple-pymethods"] }
numpy = "0.22"
rayon = "1.10"
nalgebra = "0.33"
flate2 = "1"
socket2 = { version = "0.5", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
# ふだんは Python の拡張モジュールとして作る。Rust の単体テスト（cargo test）は --no-default-features で、
# Python 3.12 につないで動かす（native/README.md の「テスト」）
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
# Python 3.10 以上のどれでも読める形（python3.dll を使う）。パッケージ版（Python 3.12 だけ）には使わない
abi3 = ["pyo3/abi3-py310"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# CI（.github/workflows/ci.yml）でテストのために作るとき：速く作る（リンク時の最適化をしない・並列に作る）
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16
